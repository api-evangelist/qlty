meters:
- name: contributor_seats
  description: Active contributors billed per month on Pro and Enterprise plans.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: analysis_minutes
  description: Cloud analysis minutes consumed per month, bounded by plan quota.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - repository
- name: analysis_minutes_overage
  description: Additional analysis minutes purchased beyond the Enterprise quota at $0.01/minute.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
- name: ai_autofixes
  description: AI autofixes consumed per month, bounded by plan quota.
  unit: autofixes
  aggregation: sum
  dimensions:
  - account
  - repository
- name: coverage_uploads
  description: Coverage reports published via qlty coverage publish; counts against plan analysis quota.
  unit: uploads
  aggregation: sum
  dimensions:
  - account
  - repository
principles:
- name: Visibility
  description: Track active contributor count and monthly analysis-minute / autofix burn against plan quotas.
- name: Allocation
  description: Map repositories and contributors to teams / cost centers; the free CLI offloads work from metered cloud minutes.
- name: Optimization
  description: Use the free Qlty CLI locally and in CI where possible; choose annual billing (two months free) and apply OSS / education / non-profit / volume discounts; right-size the per-contributor plan.
- name: Accountability
  description: Review seat count and analysis-minute consumption monthly; manage Enterprise overage at $0.01/minute against budget.
