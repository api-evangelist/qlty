description: >-
  FinOps view of Qlty spend. The Qlty CLI is free for all use. Qlty Cloud bills
  on a per-contributor (seat) subscription model - Free, Pro ($20/contributor/mo),
  and Enterprise ($30/contributor/mo) - with monthly quotas of analysis minutes
  and AI autofixes. Enterprise can purchase additional analysis minutes at
  $0.01/minute. Annual billing includes two months free; discounts apply for
  open source, education, non-profits, and volume.
notes: >-
  Per-seat rates and quotas are subject to change; verify against the Qlty
  pricing page during reconciliation.
sources:
- https://qlty.sh/pricing
- https://docs.qlty.sh/what-is-qlty
- https://focus.finops.org/focus-specification/v1-3/
